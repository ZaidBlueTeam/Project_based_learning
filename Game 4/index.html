<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Sonic the Hedgehog</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <h1>Classic Sonic Engine PROTOTYPE</h1>
    <div id="gameContainer">
        <div id="backgroundImg"></div>
        <img id="titleScreenImg">
        <canvas id="gameCanvas" width="900" height="600"></canvas>
        <img id="playerImg" src="images/sonic.png">
        
        <!-- Mobile Controls -->
        <div id="mobileControls">
            <button id="startBtn" class="mobileBtn startBtn">START</button>
            <button id="leftBtn" class="mobileBtn">←</button>
            <button id="rightBtn" class="mobileBtn">→</button>
            <button id="jumpBtn" class="mobileBtn">↑</button>
            <button id="spindashBtn" class="mobileBtn">↓</button>
        </div>
    </div>
    <audio id="titleMusic">
        <source src="audio/title.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>
    <audio id="bgMusic" loop>
        <source src="audio/green_hill.ogg" type="audio/ogg">
        Your browser does not support the audio element.
    </audio>
    <audio id="jumpSound">
        <source src="audio/jump.wav" type="audio/wav">
        Your browser does not support the audio element.
    </audio>
    <audio id="spindashSound">
        <source src="audio/spindash.wav" type="audio/wav">
        Your browser does not support the audio element.
    </audio>
    <audio id="victoryMusic">
        <source src="audio/victoryMusic.ogg" type="audio/ogg">
        Your browser does not support the audio element.
    </audio>
    <audio id="gameCompleteMusic">
        <source src="audio/game_complete.ogg" type="audio/ogg">
        Your browser does not support the audio element.
    </audio>
    <script src="js/config.js"></script>
    <script src="js/player.js"></script>
    <script src="js/enemy.js"></script>
    <script src="js/entities.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
